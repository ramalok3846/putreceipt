name = "putreceipt"
main = "worker/index.js"
compatibility_date = "2026-09-23"

[assets]
directory = "./"
binding = "ASSETS"

# Cloudflare가 브랜치(비-production) 배포 시 `npx wrangler preview`를 실행하는데,
# 이 명령은 wrangler.toml에 [previews] 블록이 있어야만 동작합니다(비어 있어도 됨).
[previews]

# 관리 페이지(매니저/차단 이메일 목록, AI 하루 토큰 한도)가 쓰는 KV 저장소.
# Cloudflare 대시보드에서 바인딩을 추가하면 여기에도 반영해야, 다음 배포 때
# wrangler.toml 기준으로 덮어써지면서 바인딩이 사라지는 걸 막을 수 있습니다.
[[kv_namespaces]]
binding = "MANAGERS_KV"
id = "30c58ee828c44245aaea28f5294854f1"

# Cloudflare Cron Trigger의 최소 주기는 1분이라, 이건 아래 Durable Object의 alarm
# 체인이 꺼져 있을 때만 다시 깨우는 안전망입니다. 실제 몇 초 단위 동기화는
# SyncDurableObject가 담당합니다.
[triggers]
crons = ["*/1 * * * *"]

# 옛 프로젝트(fir-2-f3b80) DB를 pal-inte-db로 몇 초 간격(SYNC_DO_INTERVAL_MS)으로
# 계속 복제(미러링)하는 Durable Object. Workers 무료 플랜은 SQLite 기반 Durable
# Object만 지원하므로 new_sqlite_classes를 씁니다.
[[durable_objects.bindings]]
name = "SYNC_DO"
class_name = "SyncDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncDurableObject"]
