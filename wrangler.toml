name = "putreceipt"
main = "worker/index.js"
compatibility_date = "2026-09-23"

[assets]
directory = "./"
binding = "ASSETS"

# Cloudflare가 브랜치(비-production) 배포 시 `npx wrangler preview`를 실행하는데,
# 이 명령은 wrangler.toml에 [previews] 블록이 있어야만 동작합니다(비어 있어도 됨).
[previews]

# 관리 페이지(매니저/차단 이메일 목록, AI 하루 토큰 한도)가 쓰는 KV 저장소.
# Cloudflare 대시보드에서 바인딩을 추가하면 여기에도 반영해야, 다음 배포 때
# wrangler.toml 기준으로 덮어써지면서 바인딩이 사라지는 걸 막을 수 있습니다.
[[kv_namespaces]]
binding = "MANAGERS_KV"
id = "30c58ee828c44245aaea28f5294854f1"
